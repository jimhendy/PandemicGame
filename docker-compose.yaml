services:

  pandemic:
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    build: .
    env_file: secrets.env
    environment:
      - PORT=${PORT}

  cloudflared:
    container_name: ${CONTAINER_NAME}-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: secrets.env
    depends_on:
      - pandemic

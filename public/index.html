<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Games live at /g/<id>, but image paths from the server are relative to the root -->
    <base href="/">
    <title>Pandemic</title>
    <link rel="icon" type="image/ico" href="/images/favicon.ico">

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link href="/css/style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="gameArea" class="unselectable"></div>
    <div id="toasts"></div>
</body>

<script id="lobby-template" type="text/template">
<!-- The games list -->
<div class="lobby">
    <header class="lobby-head">
        <img src="/images/pandemic_landing_image.jpg" alt="">
        <div>
            <h1>PANDEMIC</h1>
            <p>Four diseases, one planet, no pressure.</p>
        </div>
    </header>
    <div class="lobby-forms">
        <section class="panel">
            <h2>You</h2>
            <form id="name_form" class="row">
                <input id="name_input" maxlength="20" placeholder="Your name" autocomplete="off" required>
                <button class="btn">Save</button>
            </form>
            <p class="muted small" id="name_status"></p>
        </section>
        <section class="panel">
            <h2>New game</h2>
            <form id="create_form" class="row">
                <input id="title_input" maxlength="40" placeholder="Game name (optional)" autocomplete="off">
                <button class="btn btn-primary">Create game</button>
            </form>
            <p class="muted small">Then share the link with up to three friends.</p>
        </section>
    </div>
    <section>
        <h2>Games</h2>
        <div id="games_list" class="games"></div>
    </section>
</div>
</script>

<script id="game-lobby-template" type="text/template">
<!-- Choosing roles before the game starts -->
<div class="game-lobby">
    <header class="game-lobby-head">
        <div>
            <a href="/" class="back">&larr; Games</a>
            <h1 id="game_lobby_title"></h1>
        </div>
        <div class="row">
            <button class="btn" id="copy_link_button">Copy invite link</button>
            <button class="btn" id="leave_button">Leave</button>
        </div>
    </header>
    <div class="game-lobby-grid">
        <section class="panel">
            <h2>Players</h2>
            <ul id="members_list" class="members"></ul>
            <h2>Epidemics</h2>
            <form id="select_n_epidemic_cards" class="epidemics">
                <label><input type="radio" name="n_epidemics_choice" value="4"> 4 <span class="muted">intro</span></label>
                <label><input type="radio" name="n_epidemics_choice" value="5"> 5 <span class="muted">standard</span></label>
                <label><input type="radio" name="n_epidemics_choice" value="6"> 6 <span class="muted">heroic</span></label>
            </form>
            <div class="row lobby-buttons">
                <button class="btn" id="player-ready-button" disabled>I'm ready</button>
                <button class="btn btn-primary" id="start-game-button" disabled>Start game</button>
            </div>
            <p class="muted small" id="start_hint"></p>
        </section>
        <section>
            <h2>Pick a role</h2>
            <div id="role-choice-cards-div" class="roles"></div>
        </section>
    </div>
</div>
</script>

<script id="game-board-template" type="text/template">
<!-- Game Board -->
<div class="board-screen">
    <div id="board_div">
        <img src="/images/game/Board_1.jpg" class="board-image" alt="">
        <canvas id="boardCanvas" width=2056 height=2056></canvas>
        <canvas id="cubeCanvas" width=2056 height=2056></canvas>
        <canvas id="cardCanvas" width=2056 height=2056></canvas>
        <canvas id="animationCanvas" width=2056 height=2056></canvas>
        <canvas id="highlightCanvas"></canvas>
        <div id="city_hover" class="city-hover"></div>
        <div id="gifsDiv" class="gif-overlay"></div>
        <div id="yellow_cubes_counter" class="cube-counter" style="left: 32.8%; color: yellow">0/24</div>
        <div id="red_cubes_counter" class="cube-counter" style="left: 37.4%; color: red">0/24</div>
        <div id="blue_cubes_counter" class="cube-counter" style="left: 42.0%; color: #5257ff">0/24</div>
        <div id="black_cubes_counter" class="cube-counter" style="left: 46.2%; color: #c9c9c9">0/24</div>
        <div id="player_cards_remaining" class="cube-counter" style="left: 60%; width: 10%; color: #b4b4b4;"></div>
        <div id="gameOverDiv" class="game-over">
            <div class="game-over-card">
                <h1 id="game-over-title">Game Over</h1>
                <p id="game-over-message"></p>
                <img id="game-over-img" alt="">
                <div class="row">
                    <a class="btn btn-primary" href="/">Back to games</a>
                    <button class="btn" id="game-over-close">Look at the board</button>
                </div>
            </div>
        </div>
    </div>
    <div id="status_div">
        <div class="status-head">
            <a href="/" class="back">&larr; Games</a>
            <span id="game_title" class="game-title"></span>
        </div>
        <div class="status-me">
            <span>City: <strong id="player_location">Atlanta</strong></span>
            <span id="player-role-reminder" class="has-tooltip role-link"></span>
        </div>
        <div id="turn_banner" class="turn-banner"></div>
        <div id="players_panel" class="players-panel"></div>
        <div id="player_card_store"></div>
        <div id="player_selection_area"></div>
        <div id="game_log" class="log-box"></div>
        <div id="infection_counter" class="log-box">Infection Counter</div>
    </div>
</div>
</script>

<script src="/js/utils.js"></script>
<script src="/js/images.js"></script>
<script src="/js/client.js"></script>

</html>
